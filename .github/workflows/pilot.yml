name: Pilot B-Pläne
on:
  push:
    branches: [pilot]
    paths: ['pilot/steckbrief/anfragen.json', 'pilot/steckbrief.py', 'pilot/verzeichnis_quickborn.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  erkunden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils gdal-bin
      - run: pip install pyproj shapely
      - run: mkdir -p pilot/steckbrief/verzeichnis && python pilot/verzeichnis_quickborn.py 2>&1 | tail -5 > pilot/steckbrief/verzeichnis/log.txt
      - run: python pilot/steckbrief.py 2>&1 | tee pilot/steckbrief/log.txt
      - name: Ergebnis sichern
        run: |
          git config user.name "PlanX24 Pilot"
          git config user.email "pilot@planx24.de"
          git add -A pilot
          git commit -m "Steckbrief: Rohdaten geladen" || echo "nichts neu"
          git push
