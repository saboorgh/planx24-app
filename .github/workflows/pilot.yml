name: Pilot B-Pläne
on:
  push:
    branches: [pilot]
    paths: ['pilot/*.py', '.github/workflows/pilot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  erkunden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils gdal-bin
      - run: pip install pyproj
      - run: python pilot/erkunden.py 2>&1 | tee pilot/daten_log.txt
      - name: Ergebnis sichern
        run: |
          git config user.name "PlanX24 Pilot"
          git config user.email "pilot@planx24.de"
          git add -A pilot
          git commit -m "Pilot: Daten geladen" || echo "nichts neu"
          git push
